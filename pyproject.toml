[project]
name = "nflpm"
version = "0.1.0"
description = "NFL prediction-market research: Kalshi vs Polymarket vs a football model (paper only)"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nflreadpy>=0.1.5",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "pyyaml",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tenacity",
    "typer",
]

[project.scripts]
nflpm = "nflpm.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
